name: CI/CD Pipeline Simulation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install pandas matplotlib seaborn

    - name: Run Data Analysis Test
      run: |
        # Simulate running the analysis script to ensure code logic is correct
        python data_analysis.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
    
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/cloud-diet-analysis:latest

    - name: Evidence of simulated deployment
      run: |
        echo "Deployment simulated successfully at $(date)"
        
        echo "Docker image is now available at ${{ secrets.DOCKER_HUB_USERNAME }}/cloud-diet-analysis:latest"