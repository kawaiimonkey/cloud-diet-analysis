name: CI/CD Pipeline Simulation

on:
  push:
    branches: [ "main" ] # 仅在 main 分支提交时触发
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # 1. 运行测试（Task 4 要求）
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install pandas matplotlib seaborn

    - name: Run Data Analysis Test
      run: |
        # 模拟运行分析脚本，确保代码逻辑无误
        python data_analysis.py
      # 注意：如果脚本中有 plt.show()，可能会阻塞流水线，建议在测试环境中屏蔽绘图显示

    # 2. 构建并推送 Docker 镜像
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/diet-analysis:latest

    # 3. 模拟部署输出（Task 4 证据要求）
    - name: Evidence of simulated deployment
      run: |
        echo "Deployment simulated successfully at $(date)"
        echo "Docker image is now available at ${{ secrets.DOCKER_HUB_USERNAME }}/diet-analysis:latest"